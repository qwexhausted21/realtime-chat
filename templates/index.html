<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Chat | Realtime Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Экран входа -->
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h1>Nexus Chat</h1>
            <p>Введите имя, чтобы начать общение</p>
            <form id="login-form">
                <input type="text" id="username-input" placeholder="Ваше имя..." required autocomplete="off">
                <button type="submit">Войти в чат</button>
            </form>
        </div>
    </div>

    <!-- Экран чата -->
    <div id="chat-screen" class="screen">
        <div class="sidebar">
            <h2>Онлайн <span id="users-count">0</span></h2>
            <ul id="users-list"></ul>
        </div>
        <div class="chat-area">
            <div class="chat-header">
                <h2># общий-чат</h2>
            </div>
            <div class="messages" id="messages-container">
                <!-- Сюда падают сообщения -->
            </div>
            <form id="message-form" class="message-input-area">
                <input type="text" id="message-input" placeholder="Написать сообщение..." required autocomplete="off">
                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
